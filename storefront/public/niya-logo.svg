<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" fill="none">
  <!-- Creative N lettermark — left stem, diagonal, right stem with serif ornaments -->
  <g transform="translate(14, 12)">
    <!-- Left vertical stem -->
    <rect x="0" y="0" width="5.5" height="56" fill="#C9A96E"/>
    <!-- Diagonal stroke -->
    <path d="M5.5 0 L43 56 L49 56 L11 0 Z" fill="#C9A96E"/>
    <!-- Right vertical stem -->
    <rect x="43" y="0" width="5.5" height="56" fill="#C9A96E"/>
    <!-- Top serif ornaments -->
    <rect x="-4" y="0" width="14" height="1.5" fill="#C9A96E" rx="0.5"/>
    <rect x="43" y="0" width="14" height="1.5" fill="#C9A96E" rx="0.5"/>
    <!-- Bottom serif ornaments -->
    <rect x="-4" y="54.5" width="14" height="1.5" fill="#C9A96E" rx="0.5"/>
    <rect x="43" y="54.5" width="14" height="1.5" fill="#C9A96E" rx="0.5"/>
    <!-- Tiny diamond at top of diagonal -->
    <polygon points="27,18 29.5,22.5 32,18 29.5,13.5" fill="#C9A96E" opacity="0.7"/>
  </g>

  <!-- Vertical rule separator -->
  <line x1="90" y1="10" x2="90" y2="88" stroke="#C9A96E" stroke-width="0.5" opacity="0.5"/>

  <!-- NIYA text -->
  <text x="155" y="45"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="28"
    font-weight="300"
    letter-spacing="9"
    fill="#1A1A1A"
    text-anchor="middle">NIYA</text>

  <!-- Thin gold rule -->
  <line x1="108" y1="55" x2="202" y2="55" stroke="#C9A96E" stroke-width="0.6"/>
  <!-- Center diamond on rule -->
  <polygon points="155,51 157,55 155,59 153,55" fill="#C9A96E"/>

  <!-- JEWELS subtext -->
  <text x="155" y="74"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="9"
    font-weight="400"
    letter-spacing="6"
    fill="#9A7A3C"
    text-anchor="middle">JEWELS</text>
</svg>
